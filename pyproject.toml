[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ridge"
version = "1.0.0"
description = "RIDGE (Residual-Informed Diagnosis from Graph-Structured Evidence): six-stage root-cause-analysis research pipeline for emulated networks."
requires-python = "==3.12.*"
dependencies = [
    # Mininet is also a host/system dependency. The Python package alone is not enough for Stage 1 runtime. See README.md.
    "mininet",
    "torch==2.11.0",
    "pandas",
    "streamlit",
    "plotly",
    "networkx",
]

[dependency-groups]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ridge*", "apps*", "analysis*", "scripts*"]

[tool.uv]
constraint-dependencies = [
    "altair==6.2.2",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "blinker==1.9.0",
    "cachetools==7.1.4",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "cuda-bindings==12.9.7",
    "cuda-pathfinder==1.5.6",
    "cuda-toolkit==12.8.1",
    "filelock==3.31.0",
    "fsspec==2026.6.0",
    "gitdb==4.0.12",
    "GitPython==3.1.52",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "MarkupSafe==3.0.3",
    "mininet==2.3.0.dev6",
    "mpmath==1.3.0",
    "narwhals==2.24.0",
    "networkx==3.6.1",
    "numpy==2.5.1",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.19.0.56",
