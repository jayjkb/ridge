# The thesis results were produced with torch 2.11.0+cu128 from the cu128 index. 
# `uv sync` is the only supported install path.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
